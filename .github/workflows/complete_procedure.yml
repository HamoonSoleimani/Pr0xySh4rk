name: Update Pr0xySh4rk Subscription

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      config_limit:
        description: 'Max healthy configs to keep per protocol'
        required: false
        default: '50'
      speedtest:
        description: 'Run a real throughput speed test on configs that pass'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

# Prevent two runs from racing to commit at the same time (e.g. a manual
# dispatch overlapping the schedule).
concurrency:
  group: pr0xysh4rk-update
  cancel-in-progress: false

env:
  CONFIG_LIMIT: ${{ github.event.inputs.config_limit || '50' }}
  THREADS: '60'
  SPEEDTEST: ${{ github.event.inputs.speedtest || 'true' }}

jobs:
  update-proxies:
    runs-on: ubuntu-latest
    # 5 curated sources + a modern batch tester finish in minutes, not
    # hours - no need for the old 360-minute ceiling.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect configs
        run: |
          python main.py --output collected_configs.txt
          if [ ! -s collected_configs.txt ]; then
            echo "::error::Collector produced no configs - aborting before touching the published subscription."
            exit 1
          fi
          echo "Collected $(wc -l < collected_configs.txt) unique configs."

      - name: Install xray-knife
        run: |
          # NOTE: deliberately NOT using the GitHub *API* to resolve "latest"
          # (api.github.com/repos/.../releases/latest + jq) - that endpoint is
          # unauthenticated-rate-limited to 60 req/hour and silently returns a
          # rate-limit error instead of a tag under any real load, which used
          # to break this exact step. The "latest/download/<asset>" URL below
          # is a stable redirect GitHub provides specifically to avoid that.
          echo "Downloading latest xray-knife release..."
          curl -fsSL --retry 3 --retry-delay 5 -o xray-knife.zip \
            "https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip"
          unzip -o -q xray-knife.zip -d xray-knife-dist
          mv xray-knife-dist/xray-knife .
          chmod +x xray-knife
          rm -rf xray-knife-dist xray-knife.zip

          # xray-knife v11+ embeds xray-core as a library - no separate
          # xray/xray-core binary, geoip.dat or geosite.dat needed for
          # HTTP-mode testing, unlike the old collector/tester pair.
          ./xray-knife -V

      - name: Test configs and build subscription
        run: |
          set +e
          python Pr0xySh4rk.py \
            --input collected_configs.txt \
            --output Pr0xySh4rk_SubBase64.txt \
            --output-format base64 \
            --csv-report test_report.csv \
            --xray-knife-path ./xray-knife \
            --limit "${CONFIG_LIMIT}" \
            --threads "${THREADS}" \
            --overall-timeout 2700 \
            $( [ "${SPEEDTEST}" = "true" ] && echo --speedtest || echo --no-speedtest )
          rc=$?
          set -e

          # Exit code 3 means "ran fine, nothing passed this round" - the
          # tester deliberately leaves the previously published subscription
          # untouched rather than publishing an empty list. That's a normal
          # outcome for a list of free public proxies, not a pipeline error.
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then
            exit 0
          fi
          echo "::error::Pr0xySh4rk.py failed with exit code $rc"
          exit "$rc"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test_report.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add Pr0xySh4rk_SubBase64.txt

          rm -f collected_configs.txt xray-knife test_report.csv

          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update proxies: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash
            git push
          fi
